packages:
  - 'web'
  - 'packages/*'
  - 'engine'
allowBuilds:
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261127.1'
autoInstallPeers: false
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.12
